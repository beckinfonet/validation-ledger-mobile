name: CI (Simulator)

on:
  pull_request:
    branches: [main]
  # Also run on push to main for branch-protection status checks.
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        # CI pins Xcode 16.4 per docs/ci.md (Flag #2); dev MacBook runs 26.4.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install iOS 17 simulator runtime (fallback — macos-latest usually has it)
        run: xcodebuild -downloadPlatform iOS -buildVersion 17.5 || true
        continue-on-error: true

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Resolve SwiftPM packages
        # Use `swift package resolve` (not `xcodebuild -resolvePackageDependencies`):
        # only the swift CLI downloads binary-target artifacts into
        # $GITHUB_WORKSPACE/.build/artifacts/, which the SwiftLint step below needs.
        # `xcodebuild -resolvePackageDependencies` vendors packages into DerivedData
        # and skips the binary artifact entirely. `xcodebuild test` re-resolves its
        # own package graph, so a separate xcodebuild resolve step is redundant.
        run: swift package resolve

      - name: SwiftLint (strict — fail-fast before tests)
        # SwiftLintPlugins ships a SwiftPM PLUGIN + binary artifact (not an executable product),
        # so `swift run swiftlint` errors with "no executable product named 'swiftlint'". The
        # `swift package resolve` step above vendors the binary at a stable artifact path —
        # invoke it directly. Fall back to Homebrew swiftlint if the artifact is missing.
        # Honors D-02 ordering: lint gate first.
        run: |
          set -e
          SWIFTLINT_ARTIFACT="$GITHUB_WORKSPACE/.build/artifacts/swiftlintplugins/SwiftLintBinary/SwiftLintBinary.artifactbundle/macos/swiftlint"
          if [ -x "$SWIFTLINT_ARTIFACT" ]; then
            "$SWIFTLINT_ARTIFACT" lint --strict --config .swiftlint.yml
          elif command -v swiftlint >/dev/null; then
            swiftlint lint --strict --config .swiftlint.yml
          else
            echo "SwiftLint not found — artifact bundle was not vendored and brew swiftlint is absent."
            echo "Expected path: $SWIFTLINT_ARTIFACT"
            exit 1
          fi

      - name: Build + Test (simulator only — D-03 excludes Secure Enclave)
        # `-parallel-testing-enabled NO` is required — Swift Testing @Suite's run in parallel by
        # default, and multiple sibling suites (APIClientEndpointTests, MockURLProtocolRegistryTests,
        # AppContainerNetworkConfigTests) all mutate MockURLProtocol's global handler registry. The
        # .serialized trait only serializes WITHIN a suite, not across sibling suites — parallel
        # execution thrashes the shared registry and produces 404 flakes (Plan 02-03 deferred-items
        # diagnosis; Plan 02-07 Task 7 closes). Total test-time cost is ~6s vs ~20s parallel.
        run: |
          set -o pipefail
          xcodebuild test \
            -project validationLedger.xcodeproj \
            -scheme validationLedger \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath $PWD/build/TestResults.xcresult \
            -only-testing:validationLedgerTests \
            -only-testing:validationLedgerUITests/RoleShellSmokeTests

      - name: Verify PrivacyInfo.xcprivacy in bundle (Pitfall P14 / FOUND-06)
        run: bash scripts/check-privacy-manifest.sh
        env:
          SCHEME: validationLedger
          PROJECT: validationLedger.xcodeproj
          DESTINATION: "platform=iOS Simulator,name=iPhone 15,OS=17.5"

      - name: Coverage gate (Core/ >= 70% — CI-01)
        run: bash scripts/check-coverage.sh $PWD/build/TestResults.xcresult 70

      - name: Verify Release binary has no sim-bypass symbols (D-10 guard)
        # Phase 4: ensure SimulatorBypassAttestationService does NOT leak into Release.
        # Script archives Release config, greps binary for "sim-bypass-" strings, fails if any.
        run: bash scripts/verify-release-no-sim-bypass.sh $PWD/build/release-check

      - name: Upload test result bundle (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 7
