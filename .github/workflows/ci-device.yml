name: CI (Device)

on:
  # Manual trigger — re-run the device job from the Actions tab after reconnecting
  # the device or restarting the self-hosted runner, without pushing a dummy commit.
  workflow_dispatch:
  # D-16: the device security surface runs on every merge to main.
  push:
    branches: [main]
  # D-16: PR gate. NOTE — intentionally NO `paths:` filter. The workflow triggers on
  # EVERY PR so the required `device-security-surface` check is always reported; a
  # path-filtered required check that never runs would leave non-security PRs stuck
  # forever "waiting for status". The `changes` job below does the path filtering: it
  # skips the expensive device job when no security-surface path changed, and GitHub
  # treats a skipped required check as passing.
  pull_request:
    branches: [main]

jobs:
  # Fast path-detection gate (GitHub-hosted, ~15s). Keeps the self-hosted Mac runner
  # free on PRs that don't touch the security surface.
  changes:
    runs-on: ubuntu-latest
    outputs:
      device: ${{ steps.detect.outputs.device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the PR base...head diff resolves

      - name: Detect security-surface changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Fail-safe: defaults to device=true on anything ambiguous (non-PR event, diff
        # failure). The ONLY path to device=false is a clean diff matching no security path.
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME) — device surface runs."
            echo "device=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null) || {
            echo "diff failed — defaulting to device=true (fail-safe)."
            echo "device=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # Security surface: D-05 Phase 1 paths + Phase 4 additions + the workflow itself.
          PATTERN='^(validationLedger/Core/Auth/|validationLedger/Core/KeyStore/|validationLedger/Core/Identity/|validationLedger/Core/Networking/CertificatePinning/|validationLedger/Core/Attestation/|validationLedger/Core/Storage/Keychain/|validationLedger/App/Info\.plist|validationLedgerDeviceTests/|\.github/workflows/ci-device\.yml)'
          if printf '%s\n' "$CHANGED" | grep -E -q "$PATTERN"; then
            echo "Security-surface paths changed — device surface runs."
            echo "device=true" >> "$GITHUB_OUTPUT"
          else
            echo "No security-surface paths changed — device job skipped."
            echo "device=false" >> "$GITHUB_OUTPUT"
          fi

  # Job name MUST be stable (Pitfall 4 — this name is referenced in branch protection).
  # Skipped (not failed) when `changes` reports device=false — GitHub counts a skipped
  # required check as passing, so PRs that don't touch the security surface are never
  # blocked while the device runner stays free.
  device-security-surface:
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: [self-hosted, macOS, device]
    timeout-minutes: 25    # Bumped from 15 — App Attest round-trip adds latency
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The runner is installed as a LaunchAgent; its process context cannot reach the
      # unlocked login keychain that an interactive shell sees, so codesigning the XCTest
      # injection dylibs fails with errSecInternalComponent. Unlock it explicitly here and
      # (idempotently) re-assert the partition list so `codesign` is permitted
      # non-interactively. KEYCHAIN_PASSWORD = the runner account's macOS login password,
      # stored as a repo secret (see docs/ci.md).
      - name: Unlock signing keychain (self-hosted runner)
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret is not set — set it with 'gh secret set KEYCHAIN_PASSWORD' (see docs/ci.md)."
            exit 1
          fi
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

      - name: Run full device security surface (D-13) with single-retry (D-15)
        # -retry-tests-on-failure + -test-iterations 2 = retry the FAILED test once.
        # If it passes on retry → workflow green; flaky-pass annotation in xcresult → Slack.
        # If it fails twice → workflow red → merge blocked per D-16.
        # Native xcodebuild flag runs only the failed test on retry (not the whole step).
        run: |
          set -o pipefail
          xcodebuild test \
            -project validationLedger.xcodeproj \
            -scheme validationLedger \
            -destination "platform=iOS,id=${{ secrets.DEVICE_UDID }}" \
            -only-testing:validationLedgerDeviceTests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath $PWD/build/DeviceTestResults.xcresult

      - name: Upload device test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results
          path: build/DeviceTestResults.xcresult
          retention-days: 14

      - name: Notify Slack on flaky-pass (D-15 visibility)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # Parse xcresult for "retry"-labeled tests; POST to Slack only if any retries happened.
        # Quiet when zero retries. Best-effort — missing webhook doesn't fail the workflow.
        run: bash scripts/report-flaky-passes.sh $PWD/build/DeviceTestResults.xcresult || true
